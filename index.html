<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Ciclovías por Sistema</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data/datos.js?v=202610012125"></script>
<script src="data/capas.js?v=202610012125"></script>
<script src="config.js"></script>
<script src="config.local.js"></script><!-- claves privadas: sólo existe en el computador local, no se publica -->
<style>
  :root {
    --surface: #fcfcfb; --plane: #f9f9f7; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --line: #e1e0d9; --accent: #2a78d6; --accent-ink: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); }
  #app { display: flex; height: 100vh; height: 100dvh; }
  #panel { width: 360px; flex: none; overflow-y: auto; background: var(--surface);
    border-right: 1px solid var(--line); padding: 16px 16px 24px; }
  #mapWrap { flex: 1; min-width: 0; position: relative; display: flex; }
  #map { flex: 1; min-width: 0; }
  #map.sv-modo canvas, #map.medir-modo canvas { cursor: crosshair !important; }
  /* Selector de mapa base (control sobre el mapa) */
  /* Panel lateral derecho (capas y leyenda) */
  #panelDer { width: 260px; flex: none; overflow-y: auto; background: var(--surface);
    border-left: 1px solid var(--line); padding: 16px 14px 24px; }
  #panelDer h2:first-child { margin-top: 0; }
  #panelDer[hidden] { display: none; }
  #panelDer .cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  #panelDer .cab h2 { margin: 0; }
  #ocultarDer { border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12px; padding: 3px 8px; color: var(--ink-2); }
  #ocultarDer:hover { background: #f0efec; }
  #panelDer details.grp { border-top: 1px solid var(--line); padding: 2px 0; }
  #panelDer details.grp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); font-weight: 600; padding: 8px 0 6px; }
  #panelDer details.grp > summary::-webkit-details-marker { display: none; }
  #panelDer details.grp > summary::before { content: "▸"; font-size: 11px; color: var(--muted); transition: transform .15s; }
  #panelDer details.grp[open] > summary::before { transform: rotate(90deg); }
  #panelDer details.grp .activas { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500;
    color: var(--accent); font-size: 11px; }
  .ctl-der { width: 29px; height: 29px; display: grid; place-items: center; cursor: pointer; }
  .ctl-der[aria-pressed="true"] { background: #e8f0fb !important; }
  #panelDer label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 3px 0; cursor: pointer; color: var(--ink); }
  #panelDer label svg { flex: none; }
  #panelDer label small { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #panelDer .subley { display: none; flex-direction: column; gap: 1px; padding: 0 0 4px 22px; }
  #panelDer .subley.on { display: flex; }
  #panelDer .subley span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  #panelDer .notaCapa { font-size: 11px; color: var(--muted); padding: 0 0 4px 22px; }
  .ctl-base { position: relative; z-index: 3; }
  .ctl-base > button { display: grid; place-items: center; width: 34px !important; height: 34px !important; }
  .base-menu { position: absolute; top: 40px; left: 0; width: 250px; max-height: calc(100vh - 120px); overflow-y: auto;
    background: var(--surface); border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.18); padding: 6px; z-index: 5; }
  .base-menu .grupo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    font-weight: 600; padding: 8px 8px 2px; }
  .base-menu[hidden] { display: none; }
  .base-menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px;
    cursor: pointer; color: var(--ink); }
  .base-menu label:hover { background: #f0efec; }
  .base-menu label.off { color: var(--muted); cursor: not-allowed; }
  .base-menu small { color: var(--muted); font-size: 11px; }
  .base-menu .hint { font-size: 11px; color: #b4462a; padding: 4px 8px 2px; line-height: 1.4; }
  .base-menu .hint:empty { display: none; }
  /* Street View */
  #sv { width: 45%; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: #000; }
  #sv[hidden] { display: none; }
  #svBar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--surface);
    border-bottom: 1px solid var(--line); font-size: 12px; }
  #svBar b { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #svBar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  #svCerrar { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 0 2px; }
  #svFrame { flex: 1; border: 0; width: 100%; }
  .ctl-sv { width: 29px; height: 29px; display: grid; place-items: center; cursor: pointer; }
  .ctl-sv[aria-pressed="true"] { background: #fab219 !important; }
  .sv-marker { width: 28px; height: 28px; }
  /* Medición de distancia y área */
  .ctl-medir { width: 29px; height: 29px; display: grid; place-items: center; cursor: pointer; }
  .ctl-medir[aria-pressed="true"] { background: #e8f0fb !important; }
  .medir-info { background: var(--surface); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.18);
    padding: 8px 10px; font-size: 12px; color: var(--ink-2); max-width: 260px; line-height: 1.4; }
  .medir-info[hidden] { display: none; }
  .medir-info b { display: block; font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .medir-info .acc { display: flex; gap: 6px; margin-top: 6px; }
  .medir-info .acc button { border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 11.5px; padding: 2px 8px; color: var(--ink-2); }
  .medir-info .acc button:hover { background: #f0efec; }
  .medir-info.ancho { max-width: none; }
  .perfil-datos { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; margin-top: 4px; font-size: 11.5px; }
  .perfil-datos span:nth-child(even) { color: var(--ink); font-variant-numeric: tabular-nums; }
  #perfil { position: relative; margin-top: 6px; }
  #perfil:empty { display: none; }
  #perfil svg { display: block; touch-action: none; }
  #perfil text { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  #perfil .grid { stroke: var(--line); stroke-width: 1; }
  #perfil .area { fill: var(--accent); fill-opacity: .14; }
  #perfil .linea { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  #perfil .cursor line { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 2; }
  #perfil .cursor circle { fill: var(--accent); stroke: #fff; stroke-width: 2; }
  .perfil-tip { position: absolute; top: -4px; background: var(--ink); color: #fff; font-size: 11px; padding: 2px 7px;
    border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .perfil-tip b { display: inline; font-size: inherit; color: #fff; }
  .perfil-marca { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2.5px solid #fff;
    box-shadow: 0 0 0 1.5px var(--ink); }
  .pop a { color: var(--accent); text-decoration: none; display: inline-block; margin-top: 6px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { font-size: 12px; color: var(--ink-2); margin: 0 0 14px; line-height: 1.4; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 0 8px; font-weight: 600; }
  .sistemas { display: flex; flex-direction: column; gap: 4px; }
  .sistemas button { text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .sistemas button:hover { background: #f0efec; }
  .sistemas button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sistemas button::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 8px;
    border: 1.5px solid currentColor; border-radius: 3px; vertical-align: -1px; }
  .sistemas button[aria-pressed="true"]::before { content: "✓"; font-size: 10px; line-height: 11px; text-align: center; }
  .sistemas button.todos::before { border-radius: 50%; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; padding: 6px 4px; border: 0; background: #fff; font: inherit; font-size: 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  #play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
    cursor: pointer; font-size: 13px; flex: none; }
  #umbralTxt { font-size: 13px; font-weight: 600; min-width: 112px; text-align: right; font-variant-numeric: tabular-nums; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .kpi b { display: block; font-size: 19px; font-weight: 600; }
  .kpi span { font-size: 11px; color: var(--ink-2); line-height: 1.3; display: block; }
  .kpi.wide { grid-column: 1 / -1; }
  .barraTipos { display: flex; gap: 2px; height: 10px; margin: 8px 0 6px; }
  .barraTipos div { min-width: 2px; border-radius: 2px; }
  .filaTipo { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 2px 0; }
  .filaTipo svg { flex: none; }
  .filaTipo span { flex: 1; display: inline; font-size: 12px; color: var(--ink); }
  .filaTipo b { display: inline; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Panel de comparación entre sistemas (abajo al centro del mapa, desplegable) */
  #cmpPanel { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3;
    width: min(1200px, calc(100% - 20px)); background: var(--surface); border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,.2); display: flex; flex-direction: column; max-height: 48%; }
  #cmpPanel[hidden] { display: none; }
  #cmpPanel.cerrado { width: auto; }
  #cmpCab { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; font: inherit;
    padding: 8px 14px; text-align: left; color: var(--ink); }
  #cmpCab b { font-size: 13px; }
  #cmpCab small { flex: 1; font-size: 11.5px; color: var(--muted); }
  #cmpCab .chev { font-size: 12px; color: var(--ink-2); transition: transform .15s; }
  #cmpCab[aria-expanded="false"] .chev { transform: rotate(180deg); }
  #cmpCuerpo { overflow: auto; padding: 0 14px 10px; border-top: 1px solid var(--line); }
  #cmpCuerpo[hidden] { display: none; }
  .cmp-tabla { display: grid; gap: 0 12px;
    grid-template-columns: minmax(84px, 130px) minmax(140px, 1.6fr) repeat(3, minmax(96px, 1fr)); }
  .cmp-tabla > div { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .cmp-tabla .cab { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    font-weight: 600; padding-top: 8px; align-self: end; }
  .cmp-tabla .nom { font-size: 12px; color: var(--ink); align-self: center; }
  .cmp-val { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .cmp-val b { white-space: nowrap; }
  .cmp-val small { display: inline-block; white-space: nowrap; }
  .cmp-val b { font-weight: 500; color: var(--ink); }
  .cmp-val small { color: var(--muted); font-size: 10.5px; margin-left: 4px; }
  .max .cmp-val b { font-weight: 700; }
  .cmp-pista { height: 8px; background: #f0efec; border-radius: 2px; margin-top: 3px; }
  .cmp-pista > div { height: 100%; background: var(--accent); border-radius: 2px; }
  .cmp-pista.tipos { background: none; }
  .cmp-pista.tipos > div { display: flex; gap: 2px; background: none; }
  .cmp-pista.tipos > div > div { min-width: 2px; border-radius: 2px; }
  .cmp-ley { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 10.5px; color: var(--ink-2); margin-top: 8px; }
  .cmp-ley span { display: inline-flex; align-items: center; gap: 4px; }
  .cmp-ley i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .cmp-nota { font-size: 10.5px; color: var(--muted); line-height: 1.4; margin: 6px 0 0; }
  .filaTipo small { width: 34px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; cursor: pointer; }
  .ley { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; margin: 6px 0; color: var(--ink-2); }
  .ley svg { flex: none; margin-top: 3px; }
  .ley b { font-weight: 600; color: var(--ink); }
  .ley .def { display: block; font-size: 11px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
  .ramp { display: flex; height: 8px; border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
  .ramp div { flex: 1; }
  .rampLbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .ayuda { font-size: 11.5px; color: var(--ink-2); line-height: 1.45; margin: 8px 0 0; }
  .nota { font-size: 11px; color: var(--muted); line-height: 1.4; margin-top: 18px; }
  .maplibregl-popup-content { font: 12px system-ui, sans-serif; padding: 10px 12px; }
  .pop b { font-size: 13px; }
  .pop table { border-collapse: collapse; margin-top: 4px; }
  .pop td { padding: 1px 8px 1px 0; vertical-align: top; }
  .pop td:first-child { color: var(--muted); }
  #toggle { display: none; }
  @media (max-width: 720px) {
    #app { flex-direction: column-reverse; }
    #panel { width: 100%; height: 46%; border-right: 0; border-top: 1px solid var(--line); }
    #panel.min { height: auto; max-height: 52px; overflow: hidden; }
    #toggle { display: block; float: right; border: 1px solid var(--line); background: #fff; border-radius: 6px;
      font: inherit; font-size: 12px; padding: 4px 8px; }
    #mapWrap { flex-direction: column; }
    #sv { width: 100%; height: 50%; border-left: 0; border-top: 1px solid var(--line); }
    #panelDer { width: 100%; max-height: 30%; border-left: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <button id="toggle">Ocultar panel</button>
    <h1>Red de ciclovías por Sistema</h1>
    <p class="sub" id="subtitulo"></p>

    <h2>Sistemas</h2>
    <p class="ayuda" style="margin:-4px 0 8px">Puedes elegir uno o varios para verlos juntos.</p>
    <div class="sistemas" id="sistemas"></div>

    <h2>Activación de la red existente</h2>
    <div class="seg" id="modo">
      <button data-m="d" aria-pressed="true">Km por la red</button>
      <button data-m="h" aria-pressed="false">Conexiones</button>
    </div>
    <p class="ayuda" id="modoAyuda"></p>
    <div class="row">
      <button id="play" title="Animar activación" aria-label="Animar activación">▶</button>
      <input type="range" id="umbral" min="0" max="10" step="0.5" value="2">
      <span id="umbralTxt"></span>
    </div>
    <div class="ramp" id="ramp"></div>
    <div class="rampLbl"><span>cerca del sistema</span><span>lejos</span></div>

    <h2>Indicadores</h2>
    <div class="kpis" id="kpis"></div>

    <p class="nota" id="nota"></p>
  </aside>
  <div id="mapWrap">
    <div id="map">
      <section id="cmpPanel" class="cerrado" hidden>
        <button type="button" id="cmpCab" aria-expanded="false" aria-controls="cmpCuerpo">
          <b>Comparación entre sistemas</b><small id="cmpResumen"></small><span class="chev">▾</span></button>
        <div id="cmpCuerpo" hidden></div>
      </section>
    </div>
    <section id="sv" hidden>
      <div id="svBar">
        <b id="svTitulo">Street View</b>
        <a id="svLink" target="_blank" rel="noopener">Abrir en Google Maps ↗</a>
        <button id="svCerrar" title="Cerrar Street View" aria-label="Cerrar Street View">×</button>
      </div>
      <iframe id="svFrame" title="Google Street View" allowfullscreen loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
  </div>
  <aside id="panelDer">
    <div class="cab"><h2>Categorías del sistema</h2>
      <button id="ocultarDer" title="Ocultar panel de capas y leyenda">Ocultar ›</button></div>
    <div id="leyenda"></div>
    <h2>Capas</h2>
    <div id="capas"></div>
  </aside>
</div>

<script>
const D = window.DATOS;
const RAMP = ["#184f95", "#2a78d6", "#5598e7", "#86b6ef", "#b7d3f6"];
const MODOS = { d: { min: 0, max: 10, step: 0.5, val: 2 }, h: { min: 1, max: 15, step: 1, val: 2 } };
const estado = { sel: new Set(D.sistemas.filter(s => s.key !== "all").map(s => s.key)),   // al abrir: todos los sistemas
                modo: "d", umbral: 2 };
// Selección múltiple de sistemas
const ORDEN = D.sistemas.filter(s => s.key !== "all").map(s => s.key);
const elegidos = () => ORDEN.filter(k => estado.sel.has(k));
const claveCombo = () => elegidos().length === ORDEN.length ? "all" : elegidos().join("+");
// nivel/distancia de un tramo respecto de los sistemas elegidos = el menor entre ellos
function minProp(p, pref) {
  let m = null;
  for (const k of elegidos()) { const x = p[`${pref}_${k}`]; if (x != null && (m == null || x < m)) m = x; }
  return m;
}
function minExpr(pref) {
  const a = elegidos().map(k => ["to-number", ["coalesce", ["get", `${pref}_${k}`], 9999]]);
  return a.length === 0 ? 9999 : a.length === 1 ? a[0] : ["min", ...a];   // sin sistemas: nada activado
}
const tipoEstilo = Object.fromEntries(D.tipos.map(t => [t.tipo, t]));
const fmt = (x, d = 1) => Number(x).toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });

document.getElementById("subtitulo").textContent =
  `Red de ciclovías existentes: ${fmt(D.red_existente.km, 0)} km ` +
  `(ciclovías a ≤ ${D.tolerancia_m} m se consideran conectadas).`;
document.getElementById("nota").textContent =
  `Sin corrección topológica: la conectividad se estima por cercanía (≤ ${D.tolerancia_m} m). ` +
  `"Km por la red" = distancia recorrida por ciclovías existentes desde el sistema. ` +
  `Datos generados el ${D.generado}.`;

// ---------- Mapas base (CARTO claro vectorial siempre debajo; los demás son raster encima)
const CFG = Object.assign({ googleApiKey: "", googleNoOficial: false, mapaBaseInicial: "carto-claro" }, window.CONFIG || {});
const GKEY = (CFG.googleApiKey || "").trim();
const ATR_OSM = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const ATR_ESRI = "© Esri y colaboradores";
const ESRI = s => [`https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`];
const abc = (u, s = ["a", "b", "c"]) => s.map(x => u.replace("{s}", x));
const capa = (tiles, atr, max = 19) => ({ tiles, atr, max });
// Google: API oficial si hay clave; si no, URLs directas (no oficiales) sólo si googleNoOficial = true en config.js
const gDirecto = lyrs => [0, 1, 2, 3].map(n => `https://mt${n}.google.com/vt/lyrs=${lyrs}&hl=es&x={x}&y={y}&z={z}`);
const google = (id, nombre, oficial, lyrs, oscuro) => GKEY ? { id, nombre, grupo: "Google", oscuro, google: oficial } :
  CFG.googleNoOficial ? { id, nombre, grupo: "Google", oscuro, capas: [capa(gDirecto(lyrs), "Mapa © Google", 21)] } : null;
// Mapbox (Static Tiles API, oficial) sólo si hay mapboxToken en config.js
const MBTOKEN = (CFG.mapboxToken || "").trim();
const ATR_MAPBOX = '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> ' + ATR_OSM;
const mapbox = (id, nombre, estilo, oscuro) => MBTOKEN ? { id, nombre, grupo: "Mapbox", oscuro, capas: [{ ...capa(
  [`https://api.mapbox.com/styles/v1/mapbox/${estilo}/tiles/512/{z}/{x}/{y}@2x?access_token=${encodeURIComponent(MBTOKEN)}`],
  ATR_MAPBOX, 22), size: 512 }] } : null;
const BASES = [
  { id: "carto-claro", nombre: "CARTO claro", grupo: "Mapas libres", capas: [] },  // vectorial, siempre debajo
  { id: "osm", nombre: "OpenStreetMap estándar", grupo: "Mapas libres",

  for (const l of map.getStyle().layers.filter(l => l.id.startsWith("base-"))) map.removeLayer(l.id);
  for (const s of Object.keys(map.getStyle().sources).filter(s => s.startsWith("base-"))) map.removeSource(s);
  // el mapa base va debajo de la capa más baja del visor (límites comunales, o la red existente)
  const debajoDe = [...CAPAS_REF.filter(c => c.debajo).map(c => c.id), "ex-base"].find(id => map.getLayer(id));
  capas.forEach((c, i) => {
    map.addSource(`base-${i}`, { type: "raster", tiles: c.tiles, tileSize: c.size || 256, maxzoom: c.max || 20,
      attribution: c.atr });
    map.addLayer({ id: `base-${i}`, type: "raster", source: `base-${i}` }, debajoDe);
  });
  // red de fondo más clara sobre mapas oscuros/satélite
  if (map.getLayer("ex-base")) {
    map.setPaintProperty("ex-base", "line-color", base.oscuro ? AZUL_EXISTENTES_OSCURO : AZUL_EXISTENTES);
    map.setPaintProperty("sis-otros", "line-color", base.oscuro ? "#ffffff" : "#6e6d68");
    map.setPaintProperty("sis-otros", "line-opacity", base.oscuro ? 0.55 : 0.35);
    map.setPaintProperty("br", "line-color", base.oscuro ? "#fab219" : "#0b0b0b");
  }
}

async function tilesGoogle(base) {
  if (!sesionesGoogle[base.id] || sesionesGoogle[base.id].expira < Date.now() / 1000 + 300) {
    const r = await fetch(`https://tile.googleapis.com/v1/createSession?key=${encodeURIComponent(GKEY)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: "es-419", region: "CL", ...base.google }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || r.status);
    sesionesGoogle[base.id] = { token: j.session, expira: +j.expiry };
  }
  return `https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=${sesionesGoogle[base.id].token}&key=${encodeURIComponent(GKEY)}`;
}

const nombreComuna = n => String(n || "").toLowerCase().replace(/(^|\s)(\S)/g, (m, e, l) => e + l.toUpperCase())
  .replace(/\s(De|Del)(?=\s)/g, m => m.toLowerCase());
// Punto interior lejos de los bordes (aprox. "polo de inaccesibilidad"), para que la etiqueta quede dentro de la comuna
function centroInterior(anillos) {
  const ext = anillos[0];
  const dentro = (x, y) => anillos.reduce((ins, r) => {
    let c = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++)
      if ((r[i][1] > y) !== (r[j][1] > y) && x < (r[j][0] - r[i][0]) * (y - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0]) c = !c;
    return ins !== c;   // dentro del exterior y fuera de los huecos
  }, false);
  const distBorde = (x, y) => {
    let m = Infinity;
    for (const r of anillos) for (let i = 0; i < r.length - 1; i++) {
      const [ax, ay] = r[i], [bx, by] = r[i + 1], dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
      const t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)) : 0;
      m = Math.min(m, Math.hypot(x - ax - t * dx, y - ay - t * dy));
    }
    return m;
  };
  let [x0, y0, x1, y1] = [Infinity, Infinity, -Infinity, -Infinity];
  for (const [x, y] of ext) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  let mejor = null;
  for (let ronda = 0; ronda < 3; ronda++) {   // grilla 16×16 y se refina alrededor del mejor punto
    const sx = (x1 - x0) / 16, sy = (y1 - y0) / 16;
    for (let i = 0; i <= 16; i++) for (let j = 0; j <= 16; j++) {
      const x = x0 + i * sx, y = y0 + j * sy;
      if (!dentro(x, y)) continue;
      const d = distBorde(x, y);
      if (!mejor || d > mejor.d) mejor = { x, y, d };
    }
    if (!mejor) return ext[0];
    [x0, x1, y0, y1] = [mejor.x - 2 * sx, mejor.x + 2 * sx, mejor.y - 2 * sy, mejor.y + 2 * sy];
  }
  return [mejor.x, mejor.y];
}

function segmento(id, attr, fn) {

    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
    fn(b.dataset[attr]);
  });
}
function vis(id, on) { if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); }

// ---------- Render
function render(encuadrar) {
  const { modo, umbral } = estado;
  const todos = estado.sel.size === ORDEN.length, varios = estado.sel.size > 1;
  const key = claveCombo();
  document.querySelectorAll("#sistemas button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.k === "all" ? todos : b.dataset.k === "none" ? estado.sel.size === 0 :
      estado.sel.has(b.dataset.k)));
  document.getElementById("umbralTxt").textContent =
    modo === "d" ? (umbral === 0 ? "sólo contacto directo" : `hasta ${fmt(umbral)} km`) :
                   (umbral === 1 ? "sólo tributarias directas" : `hasta ${umbral} conexiones`);
  document.getElementById("modoAyuda").textContent = modo === "d" ?
    "Muestra las ciclovías existentes a las que se llega desde el sistema recorriendo como máximo esa distancia por la red existente." :
    "1 = ciclovías que tocan el sistema (tributarias directas); 2 = las que tocan a esas; 3 = las siguientes, y así sucesivamente. " +
    "Cuenta tramos de la capa, no distancia: una calle dividida en varios tramos suma varias conexiones.";

  // tramos activados: nivel >= 1 (los de nivel 0 son parte del sistema) y dentro del umbral
  const h = minExpr("h"), val = minExpr(modo);
  const filtroAct = ["all", [">=", h, 1], ["<", h, 9999], ["<=", val, umbral]];
  const colorD = ["step", val, RAMP[0], 1, RAMP[1], 2, RAMP[2], 3, RAMP[3], 5, RAMP[4]];
  const colorH = ["step", val, RAMP[0], 2, RAMP[1], 3, RAMP[2], 4, RAMP[3], 6, RAMP[4]];

  if (map.getLayer("ex-act")) {
    map.setFilter("ex-act", filtroAct); map.setFilter("ex-act-casing", filtroAct);
    map.setPaintProperty("ex-act", "line-color", modo === "d" ? colorD : colorH);
    const filtroSis = ["in", ["get", "skey"], ["literal", elegidos()]];
    map.setFilter("sis-sel", ["all", filtroSis, TRAZO.continuo]);
    map.setFilter("sis-alt", ["all", filtroSis, TRAZO.guiones]);
    map.setFilter("sis-pto", ["all", filtroSis, TRAZO.puntos]);
    map.setFilter("sis-casing", filtroSis);
    map.setFilter("sis-otros", ["!", filtroSis]);
    vis("sis-otros", document.getElementById("cOtros").checked && !todos);
    if (encuadrar && estado.sel.size) {
      const fs = D.geo.sistemas.features.filter(f => estado.sel.has(f.properties.skey));
      map.fitBounds(bbox({ features: fs }), { padding: 60, duration: 700 });
    }
  }

  // rampa (leyenda de activación)
  const lbl = modo === "d" ? ["≤1 km", "1–2", "2–3", "3–5", ">5 km"] : ["1 conexión", "2", "3", "4–5", "6+"];
  document.getElementById("ramp").innerHTML = RAMP.map((r, i) => `<div style="background:${r}" title="${lbl[i]}"></div>`).join("");
  document.querySelector(".rampLbl").innerHTML = `<span>${lbl[0]}</span><span>${lbl[2]}</span><span>${lbl[4]}</span>`;

  // indicadores
  if (!estado.sel.size) {
    document.getElementById("kpis").innerHTML = `<div class="kpi wide"><span>Ningún sistema seleccionado. Elige uno o más
      sistemas para ver la red que activan y sus indicadores.</span></div>`;
    document.getElementById("cmpPanel").hidden = true;
    return;
  }
  const st = D.stats[key];
  // se cuentan ciclovías (ejes con nombre distinto), no tramos de la capa
  let kmAct = 0;
  const ejesAct = new Set(), ejesTrib = new Set();
  for (const f of D.geo.existentes.features) {
    const p = f.properties, hh = minProp(p, "h"), vv = minProp(p, modo), eje = String(p.EJE_VIA).trim().toLowerCase();
    if (hh == 1) ejesTrib.add(eje);
    if (hh != null && hh >= 1 && vv != null && vv <= umbral) { kmAct += p.km; ejesAct.add(eje); }
  }
  const nCic = n => `${fmt(n, 0)} ${n === 1 ? "ciclovía" : "ciclovías"}`;
  // km del sistema por tipo de ciclovía (en el orden de la leyenda)
  const porTipo = {};
  for (const f of D.geo.sistemas.features)
    if (estado.sel.has(f.properties.skey)) porTipo[f.properties.tipo] = (porTipo[f.properties.tipo] || 0) + f.properties.km;
  const tipos = D.tipos.filter(t => porTipo[t.tipo] > 0)
    .concat(Object.keys(porTipo).filter(k => !tipoEstilo[k]).map(k => ({ tipo: k, etiqueta: k, color: "#898781" })));
  const total = tipos.reduce((s, t) => s + porTipo[t.tipo], 0);
  // trazos punteados o con guiones se rayan en la barra, para distinguirlos de su par del mismo color
  const relleno = t => t.trazo === "puntos" || t.trazo === "guiones" ?
    `repeating-linear-gradient(135deg, ${t.color} 0 3px, ${t.color}55 3px 6px)` : t.color;
  const sis = varios ? "los sistemas" : "el sistema";
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><b>${fmt(st.km_sistema)} km</b><span>Sistema (${fmt(st.km_nuevos)} km nuevos · ${fmt(st.km_existentes_sistema)} km existentes)</span></div>
    <div class="kpi"><b>${fmt(st.km_nivel1)} km</b><span>Tributarias directas (${nCic(ejesTrib.size)} a ≤ ${D.tolerancia_m} m)</span></div>
    <div class="kpi"><b>${fmt(st.km_sistema + st.km_nivel1)} km</b><span>${varios ? "Sistemas" : "Sistema"} + tributarias
      directas</span></div>
    <div class="kpi"><b>${fmt(kmAct)} km</b><span>Red activada con el umbral actual (${nCic(ejesAct.size)})</span></div>
    <div class="kpi wide"><span>Km de ${sis} por tipo de ciclovía</span>
      <div class="barraTipos">${tipos.map(t => `<div style="flex:${porTipo[t.tipo]};background:${relleno(t)}"
        title="${t.etiqueta}: ${fmt(porTipo[t.tipo])} km"></div>`).join("")}</div>
      ${tipos.map(t => `<div class="filaTipo"><svg width="22" height="10"><line x1="2" y1="5" x2="20" y2="5" stroke="${t.color}"
        stroke-width="4" ${TRAZO_SVG[t.trazo] || TRAZO_SVG.continuo}/></svg><span>${t.etiqueta}</span>
        <b>${fmt(porTipo[t.tipo])} km</b><small>${fmt(porTipo[t.tipo] / total * 100, 0)} %</small></div>`).join("")}
    </div>`;
  compararSistemas(tipos, relleno);
}

// ---------- Comparación entre los sistemas elegidos (con 2 o más), en un panel desplegable sobre el mapa
function compararSistemas(tipos, relleno) {
  const panel = document.getElementById("cmpPanel"), keys = elegidos();
  panel.hidden = keys.length < 2;
  if (panel.hidden) return;
  const { modo, umbral } = estado;
  const filas = keys.map(k => {
    const st = D.stats[k], porTipo = {}, ejesTrib = new Set(), ejesAct = new Set();
    let kmAct = 0;
    for (const f of D.geo.existentes.features) {
      const p = f.properties, hh = p[`h_${k}`], vv = p[`${modo}_${k}`], eje = String(p.EJE_VIA).trim().toLowerCase();
      if (hh == 1) ejesTrib.add(eje);
      if (hh != null && hh >= 1 && vv != null && vv <= umbral) { kmAct += p.km; ejesAct.add(eje); }
    }
    for (const f of D.geo.sistemas.features)
      if (f.properties.skey === k) porTipo[f.properties.tipo] = (porTipo[f.properties.tipo] || 0) + f.properties.km;
    return { nombre: D.sistemas.find(s => s.key === k).nombre.replace(/^Sistema\s+/i, ""), st, porTipo,
      trib: ejesTrib.size, kmAct, act: ejesAct.size };
  });
  const nCic = n => `${fmt(n, 0)} ${n === 1 ? "ciclovía" : "ciclovías"}`;
  // columnas: cada una con su escala, común a todos los sistemas; se destaca el mayor valor
  const cols = [
    { cab: "Km del sistema por tipo", v: f => f.st.km_sistema, det: f => `${fmt(f.st.km_nuevos)} nuevos`, tipos: true },
    { cab: "Tributarias directas", v: f => f.st.km_nivel1, det: f => nCic(f.trib) },
    { cab: "Sistema + tributarias", v: f => f.st.km_sistema + f.st.km_nivel1 },
    { cab: `Red activada (${document.getElementById("umbralTxt").textContent})`, v: f => f.kmAct, det: f => nCic(f.act) },
  ];
  cols.forEach(c => c.max = Math.max(...filas.map(c.v)) || 1);
  const barra = (c, f) => c.tipos
    ? `<div class="cmp-pista tipos"><div style="width:${c.v(f) / c.max * 100}%">${tipos.filter(t => f.porTipo[t.tipo] > 0)
        .map(t => `<div style="flex:${f.porTipo[t.tipo]};background:${relleno(t)}"
          title="${f.nombre} · ${t.etiqueta}: ${fmt(f.porTipo[t.tipo])} km (${fmt(f.porTipo[t.tipo] / c.v(f) * 100, 0)} %)"></div>`)
        .join("")}</div></div>`
    : `<div class="cmp-pista"><div style="width:${c.v(f) / c.max * 100}%"></div></div>`;
  document.getElementById("cmpResumen").textContent = `${filas.length} sistemas`;
  document.getElementById("cmpCuerpo").innerHTML = `<div class="cmp-tabla">
      <div class="cab">Sistema</div>${cols.map(c => `<div class="cab">${c.cab}</div>`).join("")}
      ${filas.map(f => `<div class="nom" title="${f.nombre}">${f.nombre}</div>` + cols.map(c =>
        `<div class="${c.v(f) === c.max ? "max" : ""}"><div class="cmp-val"><b>${fmt(c.v(f))} km</b>${c.det ?
          `<small>${c.det(f)}</small>` : ""}</div>${barra(c, f)}</div>`).join("")).join("")}
    </div>
    <div class="cmp-ley">${tipos.map(t => `<span><i style="background:${relleno(t)}"></i>${t.etiqueta}</span>`).join("")}</div>
    <p class="cmp-nota">Cada sistema evaluado por separado. Cada columna usa su propia escala, común a todos los sistemas;
      en negrita, el mayor valor. Pasa el mouse sobre la barra por tipo para ver el detalle.</p>`;
}

// ---------- Popups
function popup(e) {
  const capas = ["sis-sel", "sis-alt", "sis-pto", "br", "ex-act", "sis-otros", ...CAPAS_CLIC, "ex-base"]
    .filter(id => map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none");
  const caja = [[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]];
  const f = map.queryRenderedFeatures(caja, { layers: capas })[0];
  if (!f) return;
  const p = f.properties;
  let html;
  const cref = refDeCapa(f.layer.id);
  if (cref) {
    const [titulo, filas] = cref.popup(p);
    html = `<b>${tabla.esc(titulo)}</b>${tabla(filas)}`;
  } else if (f.layer.id.startsWith("sis")) {
    const cat = tipoEstilo[p.tipo]?.etiqueta || p.tipo;
    html = `<b>${p.nombre && p.nombre !== "null" ? p.nombre : cat}</b>${tabla([["Sistema", p.sistema], ["Categoría", cat],
      ["Definición", tipoEstilo[p.tipo]?.definicion], ["Largo", fmt(p.km, 2) + " km"]])}`;
  } else if (f.layer.id === "br") {
    html = `<b>Brecha de ${p.largo_m} m</b>${tabla([["Desde", p.desde], ["Hacia", p.hacia],
      ["Conecta ciclovías hoy separadas", p.une_fragmentos ? "Sí" : "No (ya están conectadas por otro camino)"]])}`;
  } else {
    const h = minProp(p, "h"), d = minProp(p, "d");
    html = `<b>${p.EJE_VIA || "Ciclovía existente"}</b>${tabla([
      ["Comuna", p.COMUNA], ["Tramo", [p.INICIO, p.FIN].filter(Boolean).join(" → ")], ["Tipo", p.TIPO],
      ["Operación", p.CARAC_FUNC], ["Emplazamiento", p.EMPLAZA_TE], ["Cartera", p.CARTERA], ["Largo", fmt(p.km, 2) + " km"],
      ["Activación", h == null || h === "null" ? "no conectada al sistema" : h == 0 ? "parte del sistema" :
        `${h} ${h == 1 ? "conexión (tributaria directa)" : "conexiones"} · ${fmt(d, 2)} km por la red`]])}`;
  }
  const rumbo = rumboCercano(e.point);
  const trazo = trazadoCompleto(f, e.lngLat);
  const pop = new maplibregl.Popup({ maxWidth: "320px" }).setLngLat(e.lngLat)
    .setHTML(`<div class="pop">${html}<a href="#" class="svLink">🚶 Ver Street View aquí</a>
      ${trazo ? `<br><a href="#" class="perfilLink">⛰ Ver perfil de elevación del tramo</a>` : ""}</div>`).addTo(map);
  pop.getElement().querySelector(".svLink").onclick = ev => { ev.preventDefault(); pop.remove(); abrirSV(e.lngLat, rumbo); };
  if (trazo) pop.getElement().querySelector(".perfilLink").onclick = ev => {
    ev.preventDefault(); pop.remove();
    setModoMedir("perfil");
    medir.pts = trazo;
    terminarMedida();
  };
}

      <path d="M8.5 8.5h7l-1 7h-1.6l-.6 6h-2.6l-.6-6H9.5z"/></svg></button>`;

  }
  onRemove() { this.c.remove(); }

function setModoSV(on) {

  document.getElementById("map").classList.toggle("sv-modo", on);
}

function abrirSV(lngLat, rumbo) {
  const lat = lngLat.lat.toFixed(6), lng = lngLat.lng.toFixed(6);
  const h = rumbo == null ? 0 : Math.round(rumbo);
  const urlGM = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}` + (rumbo == null ? "" : `&heading=${h}`);
  if (!GKEY) { window.open(urlGM, "_blank", "noopener"); return; }

  document.getElementById("svFrame").src = `https://www.google.com/maps/embed/v1/streetview?key=${encodeURIComponent(GKEY)}` +
    `&location=${lat},${lng}&heading=${h}&pitch=0&fov=90&language=es`;
  document.getElementById("svLink").href = urlGM;
  document.getElementById("svTitulo").textContent = `Street View · ${lat}, ${lng}`;
  const sv = document.getElementById("sv");
  if (sv.hidden) { sv.hidden = false; map.resize(); }

  // marcador con la dirección de la vista
  if (!svMarker) {
    const el = document.createElement("div");
    el.className = "sv-marker";
    el.innerHTML = `<svg viewBox="0 0 28 28" width="28" height="28"><path d="M14 1 L20 12 L8 12 Z" fill="#fab219" stroke="#0b0b0b" stroke-width="1"/>
      <circle cx="14" cy="14" r="5.5" fill="#fab219" stroke="#0b0b0b" stroke-width="1.5"/></svg>`;
    svMarker = new maplibregl.Marker({ element: el, rotationAlignment: "map" });
  }
  svMarker.setLngLat(lngLat).setRotation(h).addTo(map);
  map.easeTo({ center: lngLat, duration: 400 });
}
document.getElementById("svCerrar").onclick = () => {
  document.getElementById("sv").hidden = true;
  document.getElementById("svFrame").src = "about:blank";
  if (svMarker) svMarker.remove();
  map.resize();
};

// ---------- Medir distancia y área
// Clic agrega vértices; clic sobre el último punto (o doble clic) termina; en área, también clic sobre el primero.
// Retroceso borra el último vértice, Esc sale de la herramienta.
const medir = { modo: null, pts: [], cursor: null, fin: false, perfil: null, perfilId: 0, marca: null };
const ICO_MEDIR = {
  linea: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round">
    <path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2" stroke-linecap="round"/></svg>`,
  area: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round">
    <path d="M4 7 11 3l9 6-3 11H6z" fill="#2a78d6" fill-opacity=".18"/></svg>`,
  perfil: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round">
    <path d="M2 19 8 9l4 5 3-4 7 9z" fill="#2a78d6" fill-opacity=".18"/><path d="M2 21h20" stroke-linecap="round"/></svg>` };
const MIN_PTS = { linea: 2, area: 3, perfil: 2 };
class ControlMedir {
  onAdd() {
    this.c = document.createElement("div");
    this.c.className = "maplibregl-ctrl maplibregl-ctrl-group";
    this.c.innerHTML = `
      <button class="ctl-medir" data-modo="linea" title="Medir distancia" aria-label="Medir distancia" aria-pressed="false">${ICO_MEDIR.linea}</button>
      <button class="ctl-medir" data-modo="area" title="Medir área" aria-label="Medir área" aria-pressed="false">${ICO_MEDIR.area}</button>
      <button class="ctl-medir" data-modo="perfil" title="Perfil de elevación y pendiente" aria-label="Perfil de elevación"
        aria-pressed="false">${ICO_MEDIR.perfil}</button>`;
    this.c.querySelectorAll("button").forEach(b => b.onclick = () =>
      setModoMedir(medir.modo === b.dataset.modo ? null : b.dataset.modo));
    return this.c;
  }
  onRemove() { this.c.remove(); }
}
map.addControl(new ControlMedir(), "top-right");
class ControlMedirInfo {
  onAdd() {
    this.c = document.createElement("div");
    this.c.className = "maplibregl-ctrl medir-info";
    this.c.hidden = true;
    this.c.innerHTML = `<div id="medirTxt"></div><div id="perfil"></div><div class="acc">
      <button type="button" id="medirBorrar">Borrar</button><button type="button" id="medirSalir">Cerrar</button></div>`;
    this.c.querySelector("#medirBorrar").onclick = () => {
      Object.assign(medir, { pts: [], fin: false, cursor: null }); dibujarMedida(); };
    this.c.querySelector("#medirSalir").onclick = () => setModoMedir(null);
    return this.c;
  }
  onRemove() { this.c.remove(); }
}
map.addControl(new ControlMedirInfo(), "bottom-left");

function setModoMedir(modo) {
  if (modo && modoSV) setModoSV(false);
  Object.assign(medir, { modo, pts: [], cursor: null, fin: false });
  document.querySelectorAll(".ctl-medir").forEach(b => b.setAttribute("aria-pressed", b.dataset.modo === modo));
  document.getElementById("map").classList.toggle("medir-modo", !!modo);
  document.querySelector(".medir-info").hidden = !modo;
  modo ? map.doubleClickZoom.disable() : map.doubleClickZoom.enable();
  dibujarMedida();
}

function clicMedir(e) {
  const cerca = (ll, px = 8) => { const p = map.project(ll); return Math.hypot(p.x - e.point.x, p.y - e.point.y) <= px; };
  if (medir.fin) Object.assign(medir, { pts: [], fin: false, cursor: null });   // un clic tras terminar empieza una medición nueva
  const n = medir.pts.length;
  if (n >= MIN_PTS[medir.modo] && (cerca(medir.pts[n - 1]) || (medir.modo === "area" && cerca(medir.pts[0])))) return terminarMedida();
  if (!(n && cerca(medir.pts[n - 1], 3))) medir.pts.push([e.lngLat.lng, e.lngLat.lat]);
  dibujarMedida();
}
function terminarMedida() {
  if (medir.fin) return;
  medir.fin = true;
  dibujarMedida();
  if (medir.modo === "perfil") calcularPerfil();
}
map.on("mousemove", e => {
  if (!medir.modo || medir.fin || !medir.pts.length) return;
  medir.cursor = [e.lngLat.lng, e.lngLat.lat];
  dibujarMedida();
});
map.on("dblclick", () => { if (medir.modo && medir.pts.length >= MIN_PTS[medir.modo]) terminarMedida(); });
document.addEventListener("keydown", e => {
  if (!medir.modo || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "Escape") setModoMedir(null);
  else if (e.key === "Backspace" && !medir.fin && medir.pts.length) { medir.pts.pop(); dibujarMedida(); e.preventDefault(); }
});

// Geodesia: distancia haversine y área de polígono esférico (mismas fórmulas que Turf.js)
const RAD = Math.PI / 180;
function distM(a, b) {
  const dLat = (b[1] - a[1]) * RAD, dLon = (b[0] - a[0]) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371008.8 * Math.asin(Math.sqrt(h));
}
const largoM = pts => pts.slice(1).reduce((s, p, i) => s + distM(pts[i], p), 0);
function areaM2(pts) {
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    s += (b[0] - a[0]) * RAD * (2 + Math.sin(a[1] * RAD) + Math.sin(b[1] * RAD));
  }
  return Math.abs(s * 6378137 ** 2 / 2);
}
const fmtLargo = m => m < 1000 ? `${fmt(m, 0)} m` : `${fmt(m / 1000, 2)} km`;
const fmtArea = m2 => m2 < 10000 ? `${fmt(m2, 0)} m²` :
  m2 < 1e6 ? `${fmt(m2 / 1e4, 2)} ha` : `${fmt(m2 / 1e6, 2)} km² (${fmt(m2 / 1e4, 0)} ha)`;

function dibujarMedida() {
  const area = medir.modo === "area";
  const pts = medir.fin || !medir.cursor ? medir.pts : [...medir.pts, medir.cursor];
  const anillo = area && pts.length >= 3 ? [...pts, pts[0]] : pts;
  const fs = medir.pts.map(c => ({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: c } }));
  if (anillo.length >= 2) fs.push({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: anillo } });
  if (area && pts.length >= 3) fs.push({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [anillo] } });
  const datos = { type: "FeatureCollection", features: fs };
  if (map.getSource("medida")) map.getSource("medida").setData(datos);
  else if (map.isStyleLoaded()) {
    map.addSource("medida", { type: "geojson", data: datos });
    map.addLayer({ id: "medida-relleno", type: "fill", source: "medida", filter: ["==", ["geometry-type"], "Polygon"],
      paint: { "fill-color": "#fab219", "fill-opacity": 0.2 } });
    map.addLayer({ id: "medida-linea", type: "line", source: "medida", filter: ["==", ["geometry-type"], "LineString"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#0b0b0b", "line-width": 2.5, "line-dasharray": [2, 1.5] } });
    map.addLayer({ id: "medida-pto", type: "circle", source: "medida", filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-radius": 4.5, "circle-color": "#fab219", "circle-stroke-color": "#0b0b0b", "circle-stroke-width": 1.5 } });
  }
  const txt = document.getElementById("medirTxt");
  if (!txt) return;
  if (!(medir.modo === "perfil" && medir.fin)) limpiarPerfil();
  if (!medir.pts.length) {
    txt.innerHTML = area ? "Haz clic en el mapa para dibujar el polígono." :
      medir.modo === "perfil" ? "Traza el recorrido con clics; al terminar se muestra su perfil de elevación." :
      "Haz clic en el mapa para trazar la línea.";
    return;
  }
  if (medir.modo === "perfil" && medir.fin) return;   // el texto lo pone el perfil
  const ayuda = medir.fin ? "Clic en el mapa para una medición nueva." :
    "Doble clic o clic en el último punto para terminar · Retroceso borra el último punto.";
  txt.innerHTML = area
    ? `<b>${pts.length >= 3 ? fmtArea(areaM2(pts)) : "—"}</b>Perímetro: ${fmtLargo(largoM(anillo))}<br>${ayuda}`
    : `<b>${fmtLargo(largoM(pts))}</b>${ayuda}`;
}

// ---------- Perfil de elevación
// Elevación: teselas Terrarium (AWS Open Data, modelo de terreno global ~30 m en Chile). alto = R·256 + G + B/256 − 32768
const teselasDEM = new Map();
function teselaDEM(z, x, y) {
  const k = `${z}/${x}/${y}`;
  if (!teselasDEM.has(k)) teselasDEM.set(k, new Promise((ok, mal) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(img, 0, 0);
      ok(g.getImageData(0, 0, 256, 256).data);
    };
    img.onerror = () => { teselasDEM.delete(k); mal(new Error(`tesela ${k}`)); };
    img.src = `https://elevation-tiles-prod.s3.amazonaws.com/terrarium/${k}.png`;
  }));
  return teselasDEM.get(k);
}
// posición en píxeles "de mundo" (Web Mercator) para el zoom z
function pxMundo([lng, lat], z) {
  const n = 256 * 2 ** z, s = Math.sin(lat * RAD);
  return [(lng + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n];
}
async function elevaciones(coords, z) {
  const pos = coords.map(c => pxMundo(c, z).map(v => v - 0.5));   // centro de píxel
  const claves = new Set();
  for (const [x, y] of pos) for (const dx of [0, 1]) for (const dy of [0, 1])
    claves.add(`${Math.floor((Math.floor(x) + dx) / 256)}/${Math.floor((Math.floor(y) + dy) / 256)}`);
  const tes = {};
  await Promise.all([...claves].map(async k => { const [x, y] = k.split("/"); tes[k] = await teselaDEM(z, +x, +y); }));
  const alto = (X, Y) => {
    const d = tes[`${Math.floor(X / 256)}/${Math.floor(Y / 256)}`], i = ((Y & 255) * 256 + (X & 255)) * 4;
    return d[i] * 256 + d[i + 1] + d[i + 2] / 256 - 32768;
  };
  return pos.map(([x, y]) => {   // interpolación bilineal
    const X = Math.floor(x), Y = Math.floor(y), fx = x - X, fy = y - Y;
    return (alto(X, Y) * (1 - fx) + alto(X + 1, Y) * fx) * (1 - fy) + (alto(X, Y + 1) * (1 - fx) + alto(X + 1, Y + 1) * fx) * fy;
  });
}
// pendiente entre los puntos a ~±media metros de i (o el tramo [i, j] si se da j)
function pendienteEn(p, i, media) {
  let a = i, b = i;
  while (a > 0 && p.d[i] - p.d[a] < media) a--;
  while (b < p.d.length - 1 && p.d[b] - p.d[i] < media) b++;
  return p.d[b] > p.d[a] ? (p.z[b] - p.z[a]) / (p.d[b] - p.d[a]) : 0;
}

async function calcularPerfil() {
  const id = ++medir.perfilId, pts = medir.pts, L = largoM(pts);
  document.getElementById("medirTxt").innerHTML = `<b>${fmtLargo(L)}</b>Calculando perfil de elevación…`;
  // muestras equiespaciadas a lo largo del trazado
  const paso = Math.max(L / 600, 8), d = [], c = [];
  let acum = 0;
  for (let s = 0; s < pts.length - 1; s++) {
    const tramo = distM(pts[s], pts[s + 1]);
    for (let t = s === 0 ? 0 : (paso - (acum % paso)) % paso; t < tramo; t += paso) {
      const f = tramo ? t / tramo : 0;
      d.push(acum + t);
      c.push([pts[s][0] + (pts[s + 1][0] - pts[s][0]) * f, pts[s][1] + (pts[s + 1][1] - pts[s][1]) * f]);
    }
    acum += tramo;
  }
  d.push(L); c.push(pts[pts.length - 1]);
  let bruto;
  try { bruto = await elevaciones(c, L < 20000 ? 15 : L < 80000 ? 13 : 11); }
  catch (err) {
    if (id === medir.perfilId) document.getElementById("medirTxt").innerHTML =
      `<b>${fmtLargo(L)}</b>No se pudo obtener la elevación (¿sin conexión a internet?).`;
    return;
  }
  if (id !== medir.perfilId) return;   // el trazado cambió mientras se descargaba
  // suavizado (media móvil de ±20 m) para no sumar el ruido del modelo de terreno como desnivel
  const z = bruto.map((_, i) => {
    let s = 0, n = 0;
    for (let j = i; j >= 0 && d[i] - d[j] <= 20; j--) { s += bruto[j]; n++; }
    for (let j = i + 1; j < d.length && d[j] - d[i] <= 20; j++) { s += bruto[j]; n++; }
    return s / n;
  });
  const p = medir.perfil = { d, c, z };
  p.pend = d.map((_, i) => pendienteEn(p, i, 25));   // pendiente local (tramos de ~50 m)
  let sube = 0, baja = 0, maxSube = 0, maxBaja = 0, sobre5 = 0;
  for (let i = 1; i < d.length; i++) {
    const dz = z[i] - z[i - 1];
    dz > 0 ? sube += dz : baja -= dz;
    if (Math.abs(p.pend[i]) > 0.05) sobre5 += d[i] - d[i - 1];
  }
  // pendiente máxima sostenida en 100 m (en el sentido del trazado)
  const ventana = Math.min(100, L);
  for (let i = 0, j = 0; i < d.length; i++) {
    while (j < d.length - 1 && d[j] - d[i] < ventana) j++;
    if (d[j] - d[i] < ventana * 0.99) break;
    const g = (z[j] - z[i]) / (d[j] - d[i]);
    maxSube = Math.max(maxSube, g); maxBaja = Math.min(maxBaja, g);
  }
  const pct = g => `${g > 0 ? "+" : g < 0 ? "−" : ""}${fmt(Math.abs(g) * 100, 1)} %`;
  document.getElementById("medirTxt").innerHTML = `<b>${fmtLargo(L)} · pendiente media ${pct((z.at(-1) - z[0]) / L)}</b>
    <div class="perfil-datos">
      <span>Cota inicio → fin</span><span>${fmt(z[0], 0)} → ${fmt(z.at(-1), 0)} m</span>
      <span>Desnivel acumulado</span><span>+${fmt(sube, 0)} m / −${fmt(baja, 0)} m</span>
      <span>Pend. máx. (${fmt(ventana, 0)} m)</span><span>subida ${pct(maxSube)} · bajada ${pct(maxBaja)}</span>
      <span>Con pendiente &gt; 5 %</span><span>${fmtLargo(sobre5)} (${fmt(sobre5 / L * 100, 0)} %)</span>
    </div>`;
  graficarPerfil();
}

function graficarPerfil() {
  const p = medir.perfil, caja = document.getElementById("perfil"), info = document.querySelector(".medir-info");
  if (!p) return;
  info.classList.add("ancho");
  info.style.width = Math.min(640, map.getContainer().clientWidth - 20) + "px";
  const W = info.clientWidth - 20, H = 150, m = { l: 42, r: 8, t: 8, b: 20 };
  const L = p.d.at(-1);
  // eje Y con al menos 20 m de rango, para no exagerar visualmente terrenos planos
  let zMin = Math.min(...p.z), zMax = Math.max(...p.z);
  if (zMax - zMin < 20) { const c = (zMax + zMin) / 2; zMin = c - 10; zMax = c + 10; }
  const lindo = (rango, n) => { const b = 10 ** Math.floor(Math.log10(rango / n)); return [1, 2, 5, 10].map(k => k * b).find(k => rango / k <= n); };
  const pasoZ = lindo(zMax - zMin, 4), pasoD = lindo(L, Math.max(2, Math.floor((W - m.l) / 90)));
  zMin = Math.floor(zMin / pasoZ) * pasoZ; zMax = Math.ceil(zMax / pasoZ) * pasoZ;
  const X = v => m.l + v / L * (W - m.l - m.r), Y = v => m.t + (zMax - v) / (zMax - zMin) * (H - m.t - m.b);
  const linea = p.d.map((v, i) => `${i ? "L" : "M"}${X(v).toFixed(1)},${Y(p.z[i]).toFixed(1)}`).join("");
  const tz = [], td = [];
  for (let v = zMin; v <= zMax + 1e-9; v += pasoZ) tz.push(v);
  for (let v = 0; v <= L + 1e-9; v += pasoD) td.push(v);
  const etD = v => L < 2000 ? `${fmt(v, 0)} m` : `${fmt(v / 1000, pasoD < 1000 ? 1 : 0)} km`;
  caja.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Perfil de elevación del trazado">
    ${tz.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/>
      <text x="${m.l - 5}" y="${Y(v) + 3.5}" text-anchor="end">${fmt(v, 0)} m</text>`).join("")}
    ${td.map(v => `<text x="${X(v)}" y="${H - 5}" text-anchor="${v === 0 ? "start" : "middle"}">${etD(v)}</text>`).join("")}
    <path d="${linea}L${X(L)},${Y(zMin)}L${X(0)},${Y(zMin)}Z" class="area"/>
    <path d="${linea}" class="linea"/>
    <g class="cursor" visibility="hidden"><line y1="${m.t}" y2="${H - m.b}"/><circle r="4"/></g>
    <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
  </svg><div class="perfil-tip" hidden></div>`;
  const svg = caja.querySelector("svg"), cur = svg.querySelector(".cursor"), tip = caja.querySelector(".perfil-tip");
  svg.querySelector("rect").onpointermove = e => {
    const r = svg.getBoundingClientRect(), dist = Math.max(0, Math.min(L, (e.clientX - r.left - m.l) / (W - m.l - m.r) * L));
    let i = 0;
    while (i < p.d.length - 1 && p.d[i + 1] <= dist) i++;
    if (i < p.d.length - 1 && dist - p.d[i] > p.d[i + 1] - dist) i++;
    const x = X(p.d[i]), y = Y(p.z[i]);
    cur.setAttribute("visibility", "visible");
    cur.querySelector("line").setAttribute("x1", x); cur.querySelector("line").setAttribute("x2", x);
    cur.querySelector("circle").setAttribute("cx", x); cur.querySelector("circle").setAttribute("cy", y);
    tip.hidden = false;
    tip.innerHTML = `${fmtLargo(p.d[i])} · <b>${fmt(p.z[i], 0)} m</b> · pendiente ${p.pend[i] >= 0 ? "+" : "−"}${fmt(Math.abs(p.pend[i]) * 100, 1)} %`;
    tip.style.left = Math.min(Math.max(x - tip.offsetWidth / 2, 0), W - tip.offsetWidth) + "px";
    if (!medir.marca) {
      const el = document.createElement("div");
      el.className = "perfil-marca";
      medir.marca = new maplibregl.Marker({ element: el });
    }
    medir.marca.setLngLat(p.c[i]).addTo(map);
  };
  svg.querySelector("rect").onpointerleave = () => {
    cur.setAttribute("visibility", "hidden"); tip.hidden = true;
    if (medir.marca) medir.marca.remove();
  };
}
function limpiarPerfil() {
  medir.perfil = null; medir.perfilId++;   // descarta un cálculo en curso
  const caja = document.getElementById("perfil"), info = document.querySelector(".medir-info");
  if (caja) caja.innerHTML = "";
  if (info) { info.classList.remove("ancho"); info.style.width = ""; }
  if (medir.marca) medir.marca.remove();
}
map.on("resize", () => { if (medir.perfil) graficarPerfil(); });

// Geometría completa (sin recorte de teselas) de una línea clicada, para su perfil. En MultiLineString se unen
// las partes que se tocan y se usa la cadena más cercana al clic. Devuelve null si no es una línea.
function trazadoCompleto(f, lngLat) {
  const datos = f.source === "ex" ? D.geo.existentes : f.source === "sis" ? D.geo.sistemas :
    f.source.startsWith("ref-") ? REF[f.source.slice(4)] : null;   // puntos (y grupos) quedan fuera: no son líneas
  const g = f.id != null && datos?.features?.[f.id]?.geometry;
  if (!g) return null;
  const partes = g.type === "LineString" ? [g.coordinates] : g.type === "MultiLineString" ? g.coordinates : [];
  const cadenas = [];
  for (const p of partes.filter(p => p.length >= 2)) {
    const u = cadenas.at(-1);
    if (u && distM(u.at(-1), p[0]) < 2) u.push(...p.slice(1));
    else cadenas.push([...p]);
  }
  if (!cadenas.length) return null;
  const clic = [lngLat.lng, lngLat.lat];
  const dist = c => Math.min(...c.map(v => distM(v, clic)));
  return cadenas.reduce((a, b) => dist(b) < dist(a) ? b : a);
}

// Rumbo (grados desde el norte) del tramo de ciclovía más cercano al punto clicado
function rumboCercano(pt) {
  const capas = ["sis-sel", "sis-alt", "sis-pto", "ex-act", "sis-otros", ...CAPAS_CLIC, "ex-base"]
    .filter(id => map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none");
  const fs = map.queryRenderedFeatures([[pt.x - 12, pt.y - 12], [pt.x + 12, pt.y + 12]], { layers: capas });
  let mejor = null;
  for (const f of fs) {
    const lineas = f.geometry.type === "LineString" ? [f.geometry.coordinates] :
      f.geometry.type === "MultiLineString" ? f.geometry.coordinates : [];
    for (const l of lineas) for (let i = 0; i < l.length - 1; i++) {
      const a = map.project(l[i]), b = map.project(l[i + 1]);
      const d = distSeg(pt, a, b);
      if (!mejor || d < mejor.d) mejor = { d, a: l[i], b: l[i + 1] };
    }
  }
  if (!mejor) return null;
  const [lon1, lat1] = mejor.a.map(x => x * Math.PI / 180), [lon2, lat2] = mejor.b.map(x => x * Math.PI / 180);
  const y = Math.sin(lon2 - lon1) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function distSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / L)) : 0;
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
function tabla(filas) {
  return "<table>" + filas.filter(r => r[1] != null && r[1] !== "" && r[1] !== "s_i" && r[1] !== "null")
    .map(r => `<tr><td>${r[0]}</td><td>${tabla.esc(r[1])}</td></tr>`).join("") + "</table>";
}
tabla.esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

render(false);

function bbox(fc) {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  const walk = c => typeof c[0] === "number" ? (b = [Math.min(b[0], c[0]), Math.min(b[1], c[1]), Math.max(b[2], c[0]), Math.max(b[3], c[1])]) : c.forEach(walk);
  fc.features.forEach(f => f.geometry && walk(f.geometry.coordinates));
  return [[b[0], b[1]], [b[2], b[3]]];
}
</script>
